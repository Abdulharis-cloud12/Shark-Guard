name: SharkGuard Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # 1. BANDIT - Python Static Application Security Testing
  # ==========================================================
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r src/ -ll


  # ==========================================================
  # 2. GITLEAKS - SECRET DETECTION
  # ==========================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # 3. TRIVY - FILESYSTEM VULNERABILITY SCANNING
  # ==========================================================
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


  # ==========================================================
  # 4. SECURITY GATE
  # ==========================================================
  security-gate:
    name: 🦈 SharkGuard Security Gate
    runs-on: ubuntu-latest

    needs:
      - bandit
      - gitleaks
      - trivy

    if: always()

    steps:
      - name: Generate Security Gate Summary
        run: |
          echo "# 🦈 SharkGuard Security Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Security Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Security Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.bandit.result }}" = "success" ]; then
            echo "| Bandit SAST | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Bandit SAST | ❌ FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.gitleaks.result }}" = "success" ]; then
            echo "| Gitleaks | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Gitleaks | ❌ FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.trivy.result }}" = "success" ]; then
            echo "| Trivy | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Trivy | ❌ FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.bandit.result }}" = "success" ] && \
             [ "${{ needs.gitleaks.result }}" = "success" ] && \
             [ "${{ needs.trivy.result }}" = "success" ]; then

            echo "## ✅ SECURITY GATE PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All SharkGuard security checks passed successfully." >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ❌ SECURITY GATE FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more security checks failed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Review the failed security checks before merging." >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi
