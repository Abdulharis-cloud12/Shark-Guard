name: SharkGuard Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. BANDIT - Python SAST
  # ==========================================
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r src/ -ll


  # ==========================================
  # 2. GITLEAKS - Secret Detection
  # ==========================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # 3. TRIVY - Vulnerability Scanning
  # ==========================================
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"


  # ==========================================
  # 4. SECURITY GATE
  # ==========================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - bandit
      - gitleaks
      - trivy

    steps:
      - name: Security checks passed
        run: |
          echo "🦈 SharkGuard Security Gate PASSED"
          echo "Bandit: PASSED"
          echo "Gitleaks: PASSED"
          echo "Trivy: PASSED"
