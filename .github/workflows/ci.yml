name: SharkGuard CI & Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------
  # 1. TEST
  # ---------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v


  # ---------------------------------------------------------
  # 2. SECURITY
  # ---------------------------------------------------------
  security:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------
      # Bandit
      # -------------------------
      - name: Run Bandit
        run: |
          bandit -r src/ -ll

      # -------------------------
      # Gitleaks
      # -------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Trivy
      # -------------------------
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  # ---------------------------------------------------------
  # 3. QUALITY / SECURITY GATE
  # ---------------------------------------------------------
  gate:
    name: SharkGuard Gate
    runs-on: ubuntu-latest

    needs:
      - test
      - security

    steps:
      - name: All checks passed
        run: |
          echo "🦈 SharkGuard CI & Security Gate PASSED"
          echo "Tests: PASSED"
          echo "Bandit: PASSED"
          echo "Gitleaks: PASSED"
          echo "Trivy: PASSED"
